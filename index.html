<!DOCTYPE html>

    <title>Odin | Admin Dashboard</title>

    <div class="container">
        <div class="header">
            <div class="header-upper">
                <div id="search">
                    <img src="assets/magnify.svg" alt="Magnifying Glass" id="search-logo" height="30px" width="30px">
                    <input id="search-bar" type="search" name="search-result">
                </div>
                
                <div id="user">
                    <img src="assets/bell-ring-outline.svg" alt="Ringing Bell" id="notification-logo"  height="20px" width="20px">

                    <p id="username">Morgan Penguin</p>

            </div>
            
            <div class="header-lower">

                        <p>Hi there,</p>
                        <p id="user-greeting">Morgan Penguin (@morgan)</p>
                    </div>
                </div>
                
                <div id="header-lower-buttons">
                    <button class="header-buttons">New</button>

                </div>

        </div>
